<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DSH 注释演示</title>
<style>body{font:16px/1.7 system-ui;max-width:700px;margin:60px auto;padding:24px;background:#f4f6fa;color:#243047}article{background:white;padding:30px;border-radius:18px}button,a{display:inline-block;padding:10px 18px;border-radius:9px;background:#436fe3;color:white;border:0;text-decoration:none;cursor:pointer}output{display:block;margin:16px 0}</style>
<article><h1>DSH 右边栏注释插件</h1><p>进入“点选注释”，点击这段文字并填写意见。注释应出现在输入框上方，输入框不会出现定位代码。</p><p>连续添加两条注释，悬停注释数量可以编辑或删除。</p><button onclick="document.querySelector('output').textContent='按钮已执行'">可交互按钮</button> <a href="#destination">可跳转链接</a><output>等待操作</output><p id="destination">注释模式下，按钮和链接不应执行；退出后恢复。</p></article></html>
